<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background so it reads as an app icon -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- shield body -->
  <path d="M256 92
           L392 146
           V262
           C392 350 330 404 256 430
           C182 404 120 350 120 262
           V146 Z"
        fill="url(#shield)" stroke="url(#edge)" stroke-width="6"/>

  <!-- inner lock cutout: shows 'enforced' -->
  <g fill="#F9FAFB">
    <!-- lock shackle -->
    <path d="M256 196
             a34 34 0 0 1 34 34
             v22
             h-22
             v-22
             a12 12 0 0 0 -24 0
             v22
             h-22
             v-22
             a34 34 0 0 1 34 -34 Z"/>
    <!-- lock body -->
    <rect x="212" y="252" width="88" height="72" rx="14"/>
  </g>
  <!-- keyhole (dark) -->
  <g fill="#0B0F19">
    <circle cx="256" cy="282" r="11"/>
    <rect x="251" y="286" width="10" height="26" rx="3"/>
  </g>
</svg>
